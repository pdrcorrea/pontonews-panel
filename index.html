<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PontoView • Notícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --pv-blue:#08479a;
  --pv-deep:#032a61;
  --pv-sky:#69cff2;
  --white:#f7fbff;
  --soft:rgba(247,251,255,.72);
  --faint:rgba(247,251,255,.45);
  --panel:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.14);
  --safe:clamp(24px,3.4vw,58px);
  --radius:clamp(24px,2.4vw,36px);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%}
body{
  margin:0;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--white);
  background:linear-gradient(145deg,#0a4ea5,#043775 62%,#032d63);
}
.ambient,.ambient::before,.ambient::after{position:fixed;pointer-events:none;content:"";z-index:0}
.ambient{
  inset:-18%;
  background:
    radial-gradient(circle at 15% 22%,rgba(105,207,242,.23) 0 8%,transparent 30%),
    radial-gradient(circle at 84% 28%,rgba(255,255,255,.08) 0 8%,transparent 30%),
    radial-gradient(circle at 66% 84%,rgba(105,207,242,.10) 0 10%,transparent 34%);
  animation:ambientFloat 24s ease-in-out infinite alternate;
}
.ambient::before{
  width:min(40vw,650px);aspect-ratio:1;right:-12vw;top:-15vw;
  border:clamp(12px,1.2vw,22px) solid rgba(105,207,242,.10);
  border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;
  animation:ring 40s linear infinite;
}
.ambient::after{
  width:min(30vw,500px);aspect-ratio:1;left:-10vw;bottom:-14vw;
  border:clamp(9px,.9vw,16px) solid rgba(255,255,255,.06);
  border-top-color:transparent;border-right-color:transparent;border-radius:50%;
  animation:ring 48s linear infinite reverse;
}
@keyframes ambientFloat{from{transform:translate3d(-1.4%,0,0) scale(1)}to{transform:translate3d(1.4%,-1%,0) scale(1.03)}}
@keyframes ring{to{transform:rotate(360deg)}}
@keyframes imageBreath{50%{transform:scale(1.025)}}
@keyframes markPulse{50%{transform:scale(1.035);opacity:.96}}
.screen{
  position:relative;z-index:1;width:100%;height:100%;
  padding:var(--safe);
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:clamp(22px,2.7vh,38px);
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:22px;min-width:0}
.brand{display:flex;align-items:center;gap:15px;min-width:0}
.brandIcon{
  width:clamp(50px,4vw,66px);height:clamp(50px,4vw,66px);
  object-fit:contain;display:block;flex:0 0 auto;animation:markPulse 6s ease-in-out infinite;
}
.brandTitle{font-size:clamp(28px,2.55vw,44px);font-weight:650;line-height:1;letter-spacing:-.025em}
.sourceChip{
  display:flex;align-items:center;gap:10px;min-width:0;max-width:44vw;
  padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line)
}
.sourceDot{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.sourceDot img{width:16px;height:16px;object-fit:contain;display:block}
.sourceText{font-size:clamp(10px,.82vw,13px);font-weight:650;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}
.stage{min-height:0;display:grid;grid-template-columns:minmax(0,56%) minmax(0,44%);gap:clamp(28px,3.3vw,54px);align-items:stretch}
.copy{
  min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(12px,1.5vw,22px) 0;
}
.category{
  margin:0 0 clamp(18px,2.2vh,28px);font-size:clamp(11px,.9vw,14px);font-weight:650;
  letter-spacing:.14em;text-transform:uppercase;color:var(--pv-sky)
}
.headline{
  margin:0;
  font-size:clamp(34px,4.5vw,74px);
  font-weight:650;
  line-height:1.04;
  letter-spacing:-.045em;
  text-wrap:balance;
  overflow:visible;
}
.desc{
  margin:clamp(20px,2.5vh,30px) 0 0;
  font-size:clamp(15px,1.27vw,20px);
  line-height:1.48;color:var(--soft);max-width:64ch;
}
.media{
  min-width:0;min-height:0;position:relative;overflow:hidden;border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(105,207,242,.15),rgba(255,255,255,.035));
  border:1px solid var(--line)
}
.mediaFrame{position:absolute;inset:0;overflow:hidden}
.media img.newsImage{width:100%;height:100%;object-fit:cover;display:block;animation:imageBreath 13s ease-in-out infinite}
.media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,42,97,.01),rgba(3,42,97,.38));pointer-events:none}
.media.noimg .newsImage{display:none}
.media.noimg .fallbackMark{display:grid}
.fallbackMark{display:none;position:absolute;inset:0;place-items:center;padding:18%;z-index:0}
.fallbackMark img{width:min(52%,210px);height:auto;opacity:.30;filter:brightness(0) invert(1)}
.qrCard{
  position:absolute;right:18px;bottom:18px;z-index:3;
  display:flex;align-items:center;gap:11px;
  padding:10px 12px 10px 10px;border-radius:18px;
  background:rgba(3,42,97,.74);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.qrCard.hidden{display:none}
.qrCode{width:70px;height:70px;border-radius:11px;background:#fff;display:block}
.qrCopy{display:flex;flex-direction:column;gap:4px;max-width:145px}
.qrTitle{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.qrHint{font-size:10px;line-height:1.25;color:rgba(255,255,255,.72)}
.progressTrack{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:4}
.progressFill{height:100%;width:0;background:linear-gradient(90deg,var(--pv-sky),rgba(255,255,255,.9));transform-origin:left}
.footer{display:flex;align-items:center;justify-content:center;min-height:30px}
.logo{height:clamp(22px,2vw,31px);width:auto;display:block;filter:brightness(0) invert(1);opacity:.90}
.fade{transition:opacity .52s var(--ease),transform .52s var(--ease),filter .52s var(--ease)}
.out{opacity:0;transform:translateY(10px);filter:blur(2px)}
.in{opacity:1;transform:none;filter:none}
@media (orientation:landscape) and (max-height:760px){
  .screen{padding-top:20px;padding-bottom:16px;gap:15px}
  .brandIcon{width:48px;height:48px}.brandTitle{font-size:30px}
  .stage{grid-template-columns:minmax(0,58%) minmax(0,42%);gap:30px}
  .headline{font-size:clamp(30px,3.9vw,56px)}
  .desc{font-size:14px;margin-top:14px}.category{margin-bottom:14px}.qrCode{width:58px;height:58px}
}
@media (orientation:portrait),(max-aspect-ratio:4/5){
  .screen{padding:clamp(28px,5vw,54px) clamp(24px,5vw,52px) clamp(22px,4vw,42px);gap:clamp(24px,2.8vh,36px)}
  .sourceChip{max-width:48vw}
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,52%) minmax(0,48%);gap:clamp(22px,2.7vh,34px)}
  .copy{padding:0}.headline{font-size:clamp(34px,7vw,66px)}.desc{font-size:clamp(15px,2.5vw,20px)}
  .qrCode{width:74px;height:74px}
}
@media (orientation:portrait) and (max-width:620px){
  .brandIcon{width:46px;height:46px}.brandTitle{font-size:28px}.sourceChip{max-width:45vw;padding:8px 10px}.sourceDot{display:none!important}
  .headline{font-size:34px}.desc{font-size:14px}.stage{grid-template-rows:auto minmax(260px,1fr)}
  .qrCopy{display:none}.qrCard{padding:8px}.qrCode{width:64px;height:64px}
}
@media (prefers-reduced-motion:reduce){.ambient,.ambient::before,.ambient::after,.brandIcon,.media img.newsImage{animation:none!important}.fade{transition:none}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="screen">
  <header class="topbar">
    <div class="brand">
      <img class="brandIcon" src="assets/icon.png" alt="" aria-hidden="true">
      <div class="brandTitle">Notícias</div>
    </div>
    <div class="sourceChip" id="sourceChip" title="Fonte da notícia">
      <span class="sourceDot"><img id="favicon" alt=""></span>
      <span class="sourceText" id="sourceText">Fonte</span>
    </div>
  </header>

  <main class="stage">
    <section class="copy fade in" id="textWrap">
      <div class="category" id="category">Em destaque</div>
      <h1 class="headline" id="title">Carregando notícias…</h1>
      <p class="desc" id="desc"></p>
    </section>

    <section class="media noimg fade in" id="mediaWrap">
      <div class="mediaFrame">
        <img class="newsImage" id="image" alt="">
        <div class="fallbackMark"><img src="assets/icon.png" alt=""></div>
      </div>
      <div class="qrCard hidden" id="qrCard">
        <img class="qrCode" id="qrCode" alt="QR Code para acessar a matéria">
        <div class="qrCopy"><span class="qrTitle">Leia a matéria</span><span class="qrHint">Aponte a câmera do celular</span></div>
      </div>
      <div class="progressTrack" aria-hidden="true"><div class="progressFill" id="progressFill"></div></div>
    </section>
  </main>

  <footer class="footer"><img class="logo" src="assets/logo.png" alt="PontoView"></footer>
</div>

<script>
const WORKER_BASE="https://pontoview-api.pedrhc258.workers.dev/api/news";
const TRANSITION_MS=520;
const READ_MIN_MS=22000;
const READ_MAX_MS=34000;
const RELOAD_MS=10*60*1000;

function cleanText(t){return String(t||"").replace(/<[^>]*>/g,"").replace(/\s+/g," ").replace(/📲|👉|🔗/g,"").trim()}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch{return""}}
function favicon(u){try{return"https://www.google.com/s2/favicons?domain="+new URL(u).hostname+"&sz=64"}catch{return""}}
function imgProxy(u){if(!u)return"";let url=String(u).trim();if(url.startsWith("//"))url="https:"+url;if(!/^https?:\/\//i.test(url))return"";return"https://images.weserv.nl/?url="+encodeURIComponent(url.replace(/^https?:\/\//i,""))+"&w=1600&h=1200&fit=cover&output=webp"}
function qrUrl(link){return link?"https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data="+encodeURIComponent(link):""}
function words(t){return cleanText(t).split(/\s+/).filter(Boolean).length}
function readingTime(item){const count=words((item.title||"")+" "+(item.description||item.summary||""));return Math.min(READ_MAX_MS,Math.max(READ_MIN_MS,READ_MIN_MS+Math.max(0,count-22)*190))}

const titleEl=document.getElementById("title");
const descEl=document.getElementById("desc");
const categoryEl=document.getElementById("category");
const imageEl=document.getElementById("image");
const media=document.getElementById("mediaWrap");
const text=document.getElementById("textWrap");
const sourceText=document.getElementById("sourceText");
const faviconEl=document.getElementById("favicon");
const qrCard=document.getElementById("qrCard");
const qrCode=document.getElementById("qrCode");
const progressFill=document.getElementById("progressFill");

let NEWS=[];
let idx=0;
let nextTimer=null;
let progressFrame=null;
let slideStart=0;
let slideDuration=READ_MIN_MS;

function showOut(){text.classList.add("out");media.classList.add("out")}
function showIn(){text.classList.remove("out");media.classList.remove("out")}

function fitHeadline(){
  const copy=text;
  const min=28;
  const max=Math.min(window.matchMedia("(orientation: portrait)").matches?66:74,Math.max(38,window.innerWidth*.05));
  titleEl.style.fontSize=max+"px";
  descEl.style.display="";

  let available=copy.clientHeight;
  if(!available)return;

  const fits=()=>copy.scrollHeight<=available+1;
  if(!fits() && descEl.textContent.trim()){
    descEl.style.display="none";
  }
  if(fits())return;

  let lo=min,hi=max,best=min;
  for(let i=0;i<11;i++){
    const mid=Math.floor((lo+hi)/2);
    titleEl.style.fontSize=mid+"px";
    if(fits()){best=mid;lo=mid+1}else{hi=mid-1}
  }
  titleEl.style.fontSize=best+"px";
}

function render(item){
  const title=cleanText(item.title||"Notícia");
  const desc=cleanText(item.description||item.summary||"");
  titleEl.textContent=title;
  descEl.textContent=desc;
  descEl.style.display=desc?"":"none";
  categoryEl.textContent=item.source||"Em destaque";

  const source=item.source||host(item.link)||"Fonte";
  sourceText.textContent=source;
  const fav=favicon(item.link);
  if(fav){faviconEl.src=fav;faviconEl.parentElement.style.display="grid"}else{faviconEl.parentElement.style.display="none"}

  const img=imgProxy(item.image);
  if(img){
    imageEl.src=img;
    media.classList.remove("noimg");
    imageEl.onerror=()=>{media.classList.add("noimg");imageEl.removeAttribute("src");imageEl.onerror=null};
  }else{
    media.classList.add("noimg");
    imageEl.removeAttribute("src");
  }

  if(item.link){
    qrCode.src=qrUrl(item.link);
    qrCard.classList.remove("hidden");
    qrCode.onerror=()=>{qrCard.classList.add("hidden");qrCode.removeAttribute("src")};
  }else{
    qrCard.classList.add("hidden");
    qrCode.removeAttribute("src");
  }

  requestAnimationFrame(()=>requestAnimationFrame(fitHeadline));
}

function animateProgress(now){
  const p=Math.min(1,(now-slideStart)/slideDuration);
  progressFill.style.width=(p*100)+"%";
  if(p<1)progressFrame=requestAnimationFrame(animateProgress);
}

function schedule(item){
  clearTimeout(nextTimer);
  if(progressFrame)cancelAnimationFrame(progressFrame);
  slideDuration=readingTime(item);
  slideStart=performance.now();
  progressFill.style.width="0%";
  progressFrame=requestAnimationFrame(animateProgress);
  nextTimer=setTimeout(step,slideDuration);
}

function step(){
  if(!NEWS.length)return;
  showOut();
  setTimeout(()=>{
    const item=NEWS[idx++%NEWS.length];
    render(item);
    showIn();
    schedule(item);
  },TRANSITION_MS);
}

async function load(){
  try{
    const res=await fetch(WORKER_BASE,{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const items=Array.isArray(data.items)?data.items.filter(x=>x&&x.title):[];
    if(!items.length)throw new Error("Sem notícias");
    NEWS=items;
    idx=Math.floor(Math.random()*NEWS.length);
    const first=NEWS[idx++%NEWS.length];
    render(first);
    showIn();
    schedule(first);
  }catch(e){
    titleEl.textContent="Novas notícias em breve";
    descEl.style.display="none";
    categoryEl.textContent="PontoView";
    sourceText.textContent="Notícias";
    faviconEl.parentElement.style.display="none";
    media.classList.add("noimg");
    qrCard.classList.add("hidden");
    setTimeout(load,10000);
  }
}

let resizeTimer=null;
window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitHeadline,120)});
load();
setInterval(async()=>{
  try{
    const res=await fetch(WORKER_BASE,{cache:"no-store"});
    const data=await res.json();
    const items=Array.isArray(data.items)?data.items.filter(x=>x&&x.title):[];
    if(items.length)NEWS=items;
  }catch{}
},RELOAD_MS);
</script>
</body>
</html>
